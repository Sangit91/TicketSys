# Docker Compose — TicketSys Backend infrastructure (DB + object storage)
# Init:  docker compose up -d
# Chú ý PORT: tránh xung đột — public >= 9000 (9000 đang là vite dev; 5432 là Postgres local).
#   postgres: host 9432  -> container 5432
#   minio   : host 9100 (S3) / 9101 (console) -> container 9000 / 9001
#   api     : host 9001 (thêm khi có code NestJS)

services:
  db:
    image: postgres:16-alpine
    container_name: ticketsys-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticketsys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketsys_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-ticketsys}
    ports:
      - "9432:5432"              # host 9432 (tránh xung đột local 5432)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticketsys} -d ${POSTGRES_DB:-ticketsys}"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    container_name: ticketsys-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_change_me}
    ports:
      - "9100:9000"              # S3 API  (host 9100; vì 9000 là vite dev)
      - "9101:9001"              # Web console (host 9101)
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # api:  # <-- thêm service NestJS khi có code backend (host 9001, depends_on db/minio healthy)
  #   build: .
  #   container_name: ticketsys-api
  #   restart: unless-stopped
  #   env_file: .env
  #   environment:
  #     DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  #   ports:
  #     - "9001:3001"
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     minio:
  #       condition: service_healthy

volumes:
  pgdata:
  miniodata: